<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salary Details</title>

    <link rel="stylesheet" href="basicsalary.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

<div class="container">

    <!-- Header -->
    <header>
        <h1><i class="fas fa-wallet"></i> Salary Details</h1>
        <p>Employee Monthly Salary Information</p>
    </header>

    <!-- Summary Cards -->
    <div class="cards">

        <div class="card">
            <i class="fas fa-money-bill-wave"></i>
            <h3>Basic Pay</h3>
            <h2>₹50,000</h2>
        </div>

        <div class="card">
            <i class="fas fa-plus-circle"></i>
            <h3>HRA</h3>
            <h2>₹10,000</h2>
        </div>

        <div class="card">
            <i class="fas fa-minus-circle"></i>
            <h3>PF</h3>
            <h2>₹4,400</h2>
        </div>

        <div class="card">
            <i class="fas fa-hand-holding-usd"></i>
            <h3>Net Salary</h3>
            <h2>₹55,600</h2>
        </div>

    </div>

    <!-- Salary Table -->

    <div class="salary-box">

        <h2>Salary Breakdown</h2>

        <table>

            <thead>
                <tr>
                    <th>Description</th>
                    <th>Amount (₹)</th>
                </tr>
            </thead>

            <tbody>

                <tr>
                    <td>Basic Pay</td>
                    <td>45,000</td>
                </tr>

                <tr>
                    <td>HRA</td>
                    <td>6,000</td>
                </tr>

                <tr>
                    <td>DA</td>
                    <td>4,000</td>
                </tr>

                <tr>
                    <td>Medical Allowance</td>
                    <td>2,500</td>
                </tr>

                <tr>
                    <td>PF Deduction</td>
                    <td>-2,500</td>
                </tr>

                <tr>
                    <td>Professional Tax</td>
                    <td>-500</td>
                </tr>

                <tr>
                    <td>Income Tax</td>
                    <td>-1,500</td>
                </tr>

                <tr class="total">
                    <td>Net Salary</td>
                    <td>₹53,000</td>
                </tr>

            </tbody>

        </table>

    </div>

</div>

</body>
</html>
