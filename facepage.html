<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BCCL Login</title>

<link rel="stylesheet" href="facepage.css">

</head>

<body>

<div class="login-box">

    <img
    src="https://tse4.mm.bing.net/th/id/OIP.BXP-tpZqJykbfm2P1Ve_HAHaHa?r=0&cb=thfc1falcon2&rs=1&pid=ImgDetMain&o=7&rm=3"
    alt="Profile"
    class="logo">

    <h2>BCCL Employee Login</h2>

    <input
        type="text"
        id="username"
        placeholder="Username"
        onkeypress="handleEnter(event)"
    >

    <input
        type="password"
        id="password"
        placeholder="Password"
        onkeypress="handleEnter(event)"
    >

    <button onclick="login()">Login</button>

    <button class="register-btn" onclick="showRegister()">
        Register New User
    </button>

    <p id="msg"></p>

</div>

<!-- Registration Box -->
<div class="login-box" id="registerBox" style="display:none;">

    <h2>Create Account</h2>

    <input
        type="text"
        id="newUsername"
        placeholder="New Username"
        onkeypress="handleRegisterEnter(event)"
    >

    <input
        type="password"
        id="newPassword"
        placeholder="New Password"
        onkeypress="handleRegisterEnter(event)"
    >

    <button onclick="registerUser()">Create Account</button>

    <button onclick="hideRegister()">Back to Login</button>

    <p id="registerMsg"></p>

</div>

<script src="facepage.js"></script>

</body>
</html>
